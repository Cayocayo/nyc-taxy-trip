name: NYC Taxi MLOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    name: Automated Unit Tests (FastAPI & Streamlit)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup lingkungan Python 3.11 yang stabil di Linux runner
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install pustaka yang dibutuhkan untuk menjalankan API, App, dan Testing
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic streamlit pandas numpy requests pytest httpx

      # 4. Jalankan pengujian otomatis (test_api.py & test_app.py)
      - name: Run Pytest Suite
        run: |
          pytest -v